name: CICD Pipeline

on:
  push:
    branches:
      - "main"

jobs:
  build:
    runs-on: self-hosted

    steps:

      # 1. Checkout Source Code
      - name: Checkout Code
        uses: actions/checkout@v4

      # 2. Setup Java 17
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: "temurin"
          cache: maven

      # 3. Install Required Dependencies
      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y jq unzip

      # 4. Build Java Application
      - name: Build with Maven
        run: |
          mvn -B package --file pom.xml

      # 5. Upload JAR Artifact
      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Boardgame
          path: target/*.jar

      # 6. Trivy Filesystem Scan
      - name: Trivy FS Scan
        run: |
          trivy fs --format table -o trivy-fs-report.html .

      # 7. SonarQube Scan
      - name: SonarQube Scan
        uses: sonarsource/sonarqube-scan-action@master
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}

      # 8. SonarQube Quality Gate Check
      - name: SonarQube Quality Gate Check
        id: sonarqube-quality-gate-check
        uses: sonarsource/sonarqube-quality-gate-action@master
        timeout-minutes: 5
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}

      # 9. Setup QEMU
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      # 10. Setup Docker Buildx
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # 11. Build Docker Image
      - name: Build Docker Image
        run: |
          docker build -t hackyy11/boardgame:latest .

      # 12. Trivy Docker Image Scan
      - name: Trivy Image Scan
        run: |
          trivy image --format table -o trivy-image-report.html hackyy11/boardgame:latest

      # 13. Login to Docker Hub
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # 14. Push Docker Image
      - name: Push Docker Image
        run: |
          docker push hackyy11/boardgame:latest

      # 15. Configure kubectl
      - name: Kubectl Action
        uses: tale/kubectl-action@v1
        with:
          base64-kube-config: ${{ secrets.KUBE_CONFIG }}

      # 16. Deploy Application to Kubernetes
      - name: Deploy to Kubernetes
        run: |
          kubectl apply -f deployment-service.yaml -n webapps
          kubectl get pods -n webapps
          kubectl get svc -n webapps
