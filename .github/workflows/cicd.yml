name: CICD Pipeline

on:
  push:
    branches: [ "main" ]

jobs:
  build:

    runs-on: self-hosted

    steps:
    - uses: actions/checkout@v4
    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: maven
    - name: Build with Maven
      run: mvn -B package --file pom.xml

    - uses: actions/upload-artifact@v4
      with:
        name: Boadrdgame
        path: target/*.jar

    - name: Trivy FS Scan
      run: 
          trivy fs --format table -o trivy-fs-report.html .

    - name: SonarQube Scan
      uses: sonarsource/sonarqube-scan-action@master
      env:
        SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}

    - name: Install jq
      run: sudo apt-get update && sudo apt-get install -y jq

    #CHEK THE QUALITY GATE STATUS.
    - name: SonarQube Quality Gate Check 
      id: sonarqube-quality-gate-check
      uses: sonarsource/sonarqube-quality-gate-action@master
      #force to fail step after specific time 
      timeout-minutes: 5
      env:
        SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}

    - name: Set up  QEMU
      uses: docker/setup-qemu-action@v3

    - name: Set up Docker BuildX
      uses: docker/setup-buildx-action@v3

    - name: Build Docker Image
      run:
        docker build -t manavag-2005/boardgame:latest .

    - name: Trivy Image Scan
      run:
        trivy immage --format table -o trivy-image-report.html manavag-2005/board:latest

    - name: Login to docker hub
      uses: docker/login-action@v3
      with: 

        username: ${{ secrets.DOCKERHUB_USERNAME }}
        password: ${{ secrets.DOCKERHUB_TOKEN }}

    - name: Push docker image
      run: 
           docker push manavag-2005/boardgame:latest

    - name: Kubectl Action
      uses: tale/kubectl-action@v1
      with:
        base64-kube-config: ${{ secretS.KUBE_CONFIG }} 
    - run: 
          kubectl apply -f deployement-service.yaml -n webapps
          kubectl get svc -n webapps



      
